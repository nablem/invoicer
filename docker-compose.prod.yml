services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INVOICER_URL_PREFIX: ${INVOICER_URL_PREFIX}
        NEXT_PUBLIC_INVOICER_URL_PREFIX: ${NEXT_PUBLIC_INVOICER_URL_PREFIX}
    container_name: "invoicer_app"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GOTENBERG_URL=http://gotenberg:3000
      - INVOICER_URL_PREFIX=${INVOICER_URL_PREFIX}
      - NEXT_PUBLIC_INVOICER_URL_PREFIX=${NEXT_PUBLIC_INVOICER_URL_PREFIX}
      - NODE_ENV=production
    networks:
      - invoicer_network
    volumes:
      - "./data:/app/data"
      - "./src/templates:/app/src/templates"
      - "./public/uploads:/app/public/uploads"

  gotenberg:
    image: "gotenberg/gotenberg:8"
    container_name: "invoicer_gotenberg"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - invoicer_network

networks:
  invoicer_network:
    driver: bridge